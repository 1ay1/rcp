name: C++ SDK

# The C++ SDK had no build CI at all, on any platform. That is how it reached
# v1.0.1 with <netinet/in.h> and fork/exec wired directly into its public
# headers: nothing ever compiled it outside a developer's Linux box, so
# "header-only and portable" was an assumption, never a tested claim. The first
# consumer to try a Windows build (rag-cpp on MSYS2/ucrt64) failed instantly.
#
# This workflow makes portability a property the repo VERIFIES rather than
# asserts: every push builds and runs the SDK on Linux, macOS and Windows.

on:
  push:
    paths:
      - 'sdk/cpp/**'
      - '.github/workflows/cpp-sdk.yml'
  pull_request:
    paths:
      - 'sdk/cpp/**'
      - '.github/workflows/cpp-sdk.yml'
  workflow_dispatch:

concurrency:
  group: cpp-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux / gcc
            os: ubuntu-latest
            shell: bash
          - name: macos / clang
            os: macos-14
            shell: bash
          # The job that would have caught the port bug. MSYS2/ucrt64 is the
          # toolchain real consumers use on Windows.
          - name: windows / msys2 ucrt64
            os: windows-latest
            shell: 'msys2 {0}'
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git

      - name: Configure
        run: cmake -S sdk/cpp -B build -DCMAKE_BUILD_TYPE=Release -DRCP_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build -j 4

      # The SDK's own test binary is not wired into CTest, so build and run it
      # directly. It covers the type layer plus runtime round-trips.
      - name: Test
        run: |
          set -e
          cmake -E make_directory build/t
          c++ -std=c++23 -O2 sdk/cpp/tests/test_types.cpp \
              -I sdk/cpp/include -o build/t/test_types
          ./build/t/test_types

      # Portability is only proven if the OS-touching code is actually REACHED.
      # Every header compiling in isolation would still pass if the socket and
      # subprocess paths were dead code, so link a binary that names all of
      # them and run it: HTTP connect to a closed port, a spawned child, and
      # the server's listen path must each return a typed error rather than
      # hang, crash, or fail to link.
      - name: Transports must link and run on this OS
        run: |
          set -e
          cat > build/probe.cpp <<'EOF'
          #include "rcp/client.hpp"
          #include "rcp/server.hpp"
          #include "rcp/transport.hpp"
          #include <cstdio>
          #include <cstdlib>
          struct Probe {
              rcp::PeerInfo     info()         const { return {"probe", "0"}; }
              rcp::Capabilities capabilities() const { return {}; }
          };
          int main() {
              rcp::HttpTransport http{"http://127.0.0.1:1/"};
              auto r = http.call(nlohmann::json{{"method", "ping"}});
              if (r.has_value()) { std::puts("FAIL: connect to a closed port succeeded"); return 1; }
              std::puts("ok: http transport returned a typed error");

              auto st = rcp::StdioTransport::spawn({"rcp-no-such-program-9f2c1"});
              std::puts("ok: stdio spawn of a missing program did not crash");
              (void)st;

              rcp::Server<Probe> srv{Probe{}};
              auto reply = srv.handle_line("{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"nope\"}");
              if (reply.empty()) { std::puts("FAIL: server produced no reply"); return 1; }
              std::puts("ok: server framing works");

              if (std::getenv("RCP_PROBE_SERVE")) (void)srv.serve_http(0);  // link-only
              return 0;
          }
          EOF
          c++ -std=c++23 -O2 build/probe.cpp -I sdk/cpp/include -o build/probe $LDLIBS_EXTRA
          ./build/probe
        env:
          # mingw/gcc ignores MSVC's #pragma comment(lib), so Winsock must be
          # named explicitly when compiling outside the CMake target.
          LDLIBS_EXTRA: ${{ runner.os == 'Windows' && '-lws2_32' || '' }}

      # Guard against the exact regression class that caused the outage: a
      # POSIX-only header creeping back into the public API. platform.hpp is
      # the ONE file allowed to name them.
      - name: No POSIX-only headers outside platform.hpp
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          bad=$(grep -rn --include='*.hpp' \
                  -e '<netinet/' -e '<sys/socket.h>' -e '<arpa/inet.h>' \
                  -e '<sys/wait.h>' -e '<unistd.h>' -e '<netdb.h>' \
                  sdk/cpp/include | grep -v 'include/rcp/platform.hpp' || true)
          if [ -n "$bad" ]; then
            echo "::error::POSIX-only headers must live behind rcp/platform.hpp:"
            echo "$bad"
            exit 1
          fi
          echo "ok: no POSIX-only includes leaked into the public headers"
